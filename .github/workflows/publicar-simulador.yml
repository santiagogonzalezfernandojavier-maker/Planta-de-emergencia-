name: Publicar simulador estable
on:
  push:
    branches: [codex/simulador-d35]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: simulador-pages
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Construir y validar aplicación
        working-directory: Proyecto_Planta_Emergencia_Codex
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run site:build
          npx playwright install --with-deps chromium
          npm run test:player
          npm run test:maintenance
          npm run test:substation
          npm run test:technical
          npm run test:site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: Proyecto_Planta_Emergencia_Codex/dist/site
      - uses: actions/deploy-pages@v4
        id: deploy
