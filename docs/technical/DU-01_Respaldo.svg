<svg id="stationDiagram" viewBox="0 0 1180 1190" role="img" aria-labelledby="nomTitle nomDesc" xmlns="http://www.w3.org/2000/svg" style="font-family:Arial,sans-serif"><title id="nomTitle">Unifilar del simulador: convención gráfica CFE y referencia mexicana NMX-J-136-ANCE-2019</title><desc id="nomDesc">Red y generador con elevador alimentan una barra de 13.8 kilovolts mediante interruptores enclavados QN y QG. QS alimenta el transformador reductor y las cargas a 480 volts. Protección BT propuesta y datos pendientes de ingeniería diferenciados.</desc><defs><g id="mxWinding" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M0 -37V-10 M0 10V37 M-23 -18V-10 C-23 -2 0 -2 0 -10 C0 -2 23 -2 23 -10 V-18 M-23 18V10 C-23 2 0 2 0 10 C0 2 23 2 23 10 V18"></path></g></defs><rect width="1180" height="1190" fill="white"></rect><text x="35" y="35" font-size="22" text-anchor="start" fill="#203b49">DU-01  /  DISTRIBUCIÓN Y TRANSFERENCIA EN MEDIA TENSIÓN</text><text x="35" y="62" font-size="14" text-anchor="start" fill="#667985">Símbolos: convención CFE · Referencia NMX-J-136-ANCE-2019 · Documentación NOM-001-SEDE-2012</text><path d="M35 78H1145" fill="none" stroke="#ccd8de" stroke-width="1"></path><text x="210" y="113" font-size="17" text-anchor="middle" fill="#203b49">FUENTE NORMAL</text><text x="820" y="113" font-size="17" text-anchor="middle" fill="#203b49">FUENTE DE RESPALDO</text><text x="210" y="138" font-size="15" text-anchor="middle" fill="#203b49">Red · 13.8 kV · 3Φ</text><text x="820" y="138" font-size="15" text-anchor="middle" fill="#203b49">G · 480 V L-L · 3Φ</text><path d="M210 151V170 M200 161L210 151L220 161" fill="none" stroke="#526a77" stroke-width="3"></path><circle cx="820" cy="181" r="29" fill="white" stroke="#203b49" stroke-width="2.5"></circle><text x="820" y="188" font-size="19" text-anchor="middle" fill="#203b49">G ~</text><text x="905" y="177" font-size="15" text-anchor="start" fill="#203b49" id="nomGenRating">50 kW · 60 Hz</text><text x="905" y="